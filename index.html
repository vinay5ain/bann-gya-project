<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bann Gya Project 😎</title>
</head>
<body style="background-color: lightgreen;">
    <main>
        <div id="question">Bann Gya Project 😎</div>
        <button id="yes-button" onclick="yes()">Yes</button>
        <button id="no-button" onclick="no()">No</button>
    </main>

    <style>
        main {
            max-width: 80%;
            margin: auto;
            text-align: center;
            padding-top: 50px;
        }

        #question {
            font-family: "Times New Roman", serif;
            font-size: 2em;
            margin-bottom: 20px;
        }

        button {
            display: inline-block;
            margin: 8px;
            font-size: 1.2em;
            padding: 10px 20px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
        }

        #yes-button {
            background-color: green;
        }

        #no-button {
            background-color: red;
        }

        img {
            width: 90%;
            max-width: 300px;
            height: auto;
            margin-top: 20px;
        }
    </style>

    <script>
        const q = document.getElementById("question");
        const yes_button = document.getElementById("yes-button");
        const no_button = document.getElementById("no-button");
        let current = 0;

        const yes_no = [
            ["Bann Gya Project 😎", null],
            ["Are bhaiii Bann Gya Project 🔥", null],
            ["Ho Gya Finish 🥳", null],
            ["Arre, matlab itne bhaaw<br>achhe bachhe aise nahin karte, chalo", null],
            ["Mene nahin pda jo bhi reason diya ho, ab bs yes dabao", function(){ prompt("Batao kyu nahi jana", "chalo chalte hain bunk pe") }],
            ["Firse NO <h2>:/</h2>", null],
            ["Dikkat kya hai ??? kyu nahin daba rahe YES ?? background achha nahin hai kya ??", null],
            ["Ab thik hai color ?", function(){document.body.style.backgroundImage="linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)"}],
            ["Achha to ab kaisa hai color ?", function(){document.body.style.backgroundColor="pink";document.body.style.backgroundImage="";}],
            ["Kya chakkar hai<br>Yes ka button nahin dikh rha kya", null],
            ["Lo ab dikh rha hoga ab dabao", ()=>{yes_button.style.fontSize="3em"}],
            ["Khabardaar jo ek aur baar No dabaya to..", null],
            ["<h1>😠</h1>", null],
            ["Is NO ke button me aag lag jaye..", null],
            ["Lo lga di aag, ab YES dabana nahin to ungli jal jaygi tumhari", ()=>{no_button.innerText="🔥No🔥"}],
            ["<h1>🩹</h1>matlab ab bhi,<br>thoda ye bhi nahi socha ke ungli jal jayegi to project kaun banayega..<br><sup>ab YES dabao</sup>", null],
            ["<img src='kyu-nahi-ja-rahe-bunk-pe.png' alt='funny image'>", null],
            ["Ab to haan karni padegi, nahin to me is NO ke button ko hi gayb kr dunga 😈", null],
            ["Om bhatt shua ha..", ()=>{yes_button.style.display="none"}],
            ["Abe ye to YES ka button hi gayab ho gaya 😶😑🤦<br>thik krta hun zra..", null],
            ["Abra Kadabra Alakazam...✨", ()=>{yes_button.style.display="inline-block";}],
            ["Ab mere paas koi option nahin... ab tumhe haan hi karni hogi 😏",null],
            ["<h1>:)</h1>", ()=>{no_button.style.display="none"}],
        ];

        function no(){
            current++;
            if(current >= yes_no.length) current = yes_no.length - 1;
            q.innerHTML = yes_no[current][0];
            if (yes_no[current][1] != null){
                yes_no[current][1]();
            }
        }

        function yes(){
            window.location.href = `https://wa.me/917982537040?text= I love you vinay 😘`;
        }
    </script>
</body>
</html>
