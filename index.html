<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bann Gya Project - An interactive, fun, and visually stunning website 😎" />
    <meta name="theme-color" content="#0f0c29" />

    <!-- Title -->
    <title>Bann Gya Project 😎</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='75'%3E😎%3C/text%3E%3C/svg%3E" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Background Elements -->
    <!-- Particles Container -->
    <div id="particles-container" aria-hidden="true"></div>

    <!-- Emojis Container -->
    <div id="emojis-container" aria-hidden="true"></div>

    <!-- Chess Pieces Background -->
    <div id="chess-pieces" aria-hidden="true"></div>

    <!-- Sound Toggle Button -->
    <button class="sound-toggle" aria-label="Toggle sound" title="Toggle Sound">🔊</button>

    <!-- Main Content -->
    <main role="main">
      <!-- Card Container with Glassmorphism -->
      <div class="card-container">
        <!-- Progress Indicator -->
        <div class="progress-indicator"></div>

        <!-- Question Display -->
        <div id="question" role="status" aria-live="polite" aria-atomic="true">
          Bann Gya Project 😎
        </div>

        <!-- Button Container -->
        <div class="button-container">
          <button id="yes-button" type="button" aria-label="Yes Button" title="Click to agree">
            YES
          </button>
          <button id="no-button" type="button" aria-label="No Button" title="Click to decline">
            NO
          </button>
        </div>
      </div>
    </main>

    <!-- Success Modal -->
    <div id="success-modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
      <div class="modal-content">
        <h2 id="modal-title">🎉 Project Successfully Completed! 🥳</h2>
        <p>Vinay Kumar Sain is thrilled with your decision! ❤️</p>
        <p style="font-size: 0.9rem; margin-top: 1rem; opacity: 0.7;">Redirecting to WhatsApp in 3 seconds...</p>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      Built with ❤️ by <strong>Vinay Kumar Sain</strong>
    </footer>

    <!-- Scripts -->
    <script src="script.js" defer></script>
  </body>
</html>
